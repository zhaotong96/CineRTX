#
# Cross-platform CI: compliance first, then Linux GCC, Windows MSVC, and the
# portable Zig toolchain. Tagged commits additionally produce the audited
# Windows release archive.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  compliance:
    name: SPDX and boundary audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit SPDX headers and GPL/MIT boundary
        run: cmake -P cmake/AuditSpdx.cmake

  linux-gcc:
    name: Linux GCC (${{ matrix.build_type }})
    needs: compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Ninja and FFmpeg development packages
        # The media container layer is unconditional, and on Linux it is
        # resolved through pkg-config, so the four -dev packages are a hard
        # configure-time dependency rather than an optional extra.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev

      - name: Configure
        run: >-
          cmake --preset linux-release
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        # The concurrency tests are exercised repeatedly: a rare scheduling
        # dependent failure must be caught here rather than on a user machine.
        run: ctest --preset linux-release --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        run: cmake -DBUILD_DIR=.vs/build/cmake/linux-release -P cmake/AuditImports.cmake

      - name: Probe and CLI smoke test
        run: |
          set -euo pipefail
          ./.vs/build/cmake/linux-release/CineRTX --version
          ./.vs/build/cmake/linux-release/CineRTX --help
          ./.vs/build/cmake/linux-release/CineRTX --schema-json > .vs/build/schema.json
          python3 - <<'PY'
          import json
          schema = json.load(open(".vs/build/schema.json", encoding="utf-8"))
          assert schema.get("defaults", {}).get("codec") == "av1", "Missing default codec=av1"
          assert isinstance(schema.get("params"), list) and len(schema["params"]) == 19, "Expected 19 SSOT params"
          assert any(p.get("key") == "codec" for p in schema["params"]), "Missing codec key in params array"
          assert "i18n" in schema and "en" in schema["i18n"] and "zh" in schema["i18n"], "Missing i18n dictionary"
          print("schema JSON verification passed, param count:", len(schema["params"]))
          PY
          # In headless CI containers without NVIDIA GPUs, probe may exit 0, 4 or 5
          ./.vs/build/cmake/linux-release/CineRTX --probe --json > .vs/build/probe.json || true
          python3 - <<'PY'
          import json
          probe = json.load(open(".vs/build/probe.json", encoding="utf-8"))
          assert probe.get("abi_version") in (2, 4), f"Unexpected probe abi_version: {probe.get('abi_version')}"
          print("probe JSON verification passed, result_name:", probe.get("result_name", "UNKNOWN"))
          PY

  windows-msvc:
    name: Windows MSVC
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc-ninja

      - name: Build
        run: cmake --build --preset windows-msvc-ninja

      - name: Test
        run: ctest --preset windows-msvc-ninja --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        run: cmake -DBUILD_DIR=.vs/build/cmake/windows-msvc-ninja -P cmake/AuditImports.cmake

      - name: Probe and CLI smoke test
        shell: pwsh
        run: |
          $exe = ".vs/build/cmake/windows-msvc-ninja/CineRTX.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --schema-json > .vs\build\schema.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > .vs\build\probe.json"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { exit $LASTEXITCODE }
          python -c "import json; s=json.load(open('.vs/build/schema.json', encoding='utf-8')); assert s.get('defaults',{}).get('codec')=='av1' and len(s.get('params',[]))==19 and any(p.get('key')=='codec' for p in s['params']) and 'i18n' in s; print('schema JSON ok, params:', len(s['params']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; p=json.load(open('.vs/build/probe.json', encoding='utf-8')); assert p.get('abi_version') in (2, 4); print('probe JSON ok:', p.get('result_name', 'UNKNOWN'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-zig:
    name: Windows Zig 0.13
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig-0.13.0.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'zig-0.13.0'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $zig = Get-ChildItem -LiteralPath $dest -Recurse -Filter 'zig.exe' | Select-Object -First 1
          if (-not $zig) { throw 'zig.exe was not found in the downloaded archive' }
          "RTX_ZIG=$($zig.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset zig-windows

      - name: Build
        run: cmake --build --preset zig-windows

      - name: Test
        run: ctest --preset zig-windows --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        run: cmake -DBUILD_DIR=.vs/build/cmake/zig-windows -P cmake/AuditImports.cmake

      - name: Probe and CLI smoke test
        shell: pwsh
        run: |
          $exe = ".vs/build/cmake/zig-windows/CineRTX.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --schema-json > .vs\build\schema.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > .vs\build\probe.json"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { exit $LASTEXITCODE }
          python -c "import json; s=json.load(open('.vs/build/schema.json', encoding='utf-8')); assert s.get('defaults',{}).get('codec')=='av1' and len(s.get('params',[]))==19 and any(p.get('key')=='codec' for p in s['params']) and 'i18n' in s; print('schema JSON ok, params:', len(s['params']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; p=json.load(open('.vs/build/probe.json', encoding='utf-8')); assert p.get('abi_version') in (2, 4); print('probe JSON ok:', p.get('result_name', 'UNKNOWN'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-windows
          if-no-files-found: error
          path: |
            .vs/build/cmake/zig-windows/CineRTX.exe

  package:
    name: Package release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gcc, windows-msvc, windows-zig]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download portable binaries
        uses: actions/download-artifact@v4
        with:
          name: zig-windows
          path: .vs/build/cmake/zig-windows

      - name: Build audited archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          cmake -DBUILD_DIR=.vs/build/cmake/zig-windows -DOUTPUT_DIR=out -DVERSION=$version -P cmake/PackageRelease.cmake

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.sha256
            out/*.manifest.json

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -LiteralPath out -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "CineRTX $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
