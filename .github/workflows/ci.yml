#
# Cross-platform CI: compliance first, then Linux GCC, Windows MSVC, and the
# portable Zig toolchain. Tagged commits additionally produce the audited
# Windows release archive.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  compliance:
    name: SPDX and boundary audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit SPDX headers and GPL/MIT boundary
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/check_spdx.ps1

  linux-gcc:
    name: Linux GCC (${{ matrix.build_type }})
    needs: compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Ninja and FFmpeg development packages
        # The media container layer is unconditional, and on Linux it is
        # resolved through pkg-config, so the four -dev packages are a hard
        # configure-time dependency rather than an optional extra.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev

      - name: Configure
        run: >-
          cmake --preset linux-release
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRTX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        # The concurrency tests are exercised repeatedly: a rare scheduling
        # dependent failure must be caught here rather than on a user machine.
        run: ctest --preset linux-release --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/audit_imports.ps1 -BuildDir build/cmake/linux-release

      - name: Probe and simulate smoke test
        run: |
          set -euo pipefail
          ./build/cmake/linux-release/CineRTX --self-test
          ./build/cmake/linux-release/CineRTX \
            --simulate 2 --width 64 --height 64 \
            --target-width 128 --target-height 128 --json > build/simulate.json
          python3 - <<'PY'
          import json
          report = json.load(open("build/simulate.json", encoding="utf-8"))
          assert report["backend"] == "cpu-reference", report["backend"]
          assert report["output"]["frames"] > 0
          assert report["hdr"]["enabled"] is True
          print("simulate JSON ok:", report["output"])
          PY
          ./build/cmake/linux-release/CineRTX --probe --json > build/probe.json
          python3 - <<'PY'
          import json
          probe = json.load(open("build/probe.json", encoding="utf-8"))
          assert probe["loaded"] is True, probe
          assert probe["abi_version"] == 2, probe
          print("probe JSON ok:", probe["result_name"])
          PY

  windows-msvc:
    name: Windows MSVC
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        run: ctest --preset windows-msvc --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/audit_imports.ps1 -BuildDir build/cmake/windows-msvc/Release

      - name: Probe and simulate smoke test
        shell: pwsh
        run: |
          $exe = "build/cmake/windows-msvc/Release/CineRTX.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --simulate 2 --width 64 --height 64 --target-width 128 --target-height 128 --json > build\simulate.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > build\probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('build/simulate.json', encoding='utf-8')); assert r['backend']=='cpu-reference'; print('simulate JSON ok:', r['output'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; p=json.load(open('build/probe.json', encoding='utf-8')); assert p['loaded'] and p['abi_version']==2; print('probe JSON ok:', p['result_name'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-zig:
    name: Windows Zig 0.13
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig-0.13.0.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'zig-0.13.0'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $zig = Get-ChildItem -LiteralPath $dest -Recurse -Filter 'zig.exe' | Select-Object -First 1
          if (-not $zig) { throw 'zig.exe was not found in the downloaded archive' }
          "RTX_ZIG=$($zig.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset zig-windows -DRTX_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset zig-windows

      - name: Test
        run: ctest --preset zig-windows --output-on-failure --repeat until-fail:10

      - name: Audit import tables
        shell: pwsh
        run: pwsh -NoProfile -File ./tools/audit_imports.ps1 -BuildDir build/cmake/zig-windows

      - name: Probe and simulate smoke test
        shell: pwsh
        run: |
          $exe = "build/cmake/zig-windows/CineRTX.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --simulate 2 --width 64 --height 64 --target-width 128 --target-height 128 --json > build\simulate.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > build\probe.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; r=json.load(open('build/simulate.json', encoding='utf-8')); assert r['backend']=='cpu-reference'; print('simulate JSON ok:', r['output'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json; p=json.load(open('build/probe.json', encoding='utf-8')); assert p['loaded'] and p['abi_version']==2; print('probe JSON ok:', p['result_name'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-windows
          if-no-files-found: error
          path: |
            build/cmake/zig-windows/CineRTX.exe

  package:
    name: Package release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gcc, windows-msvc, windows-zig]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download portable binaries
        uses: actions/download-artifact@v4
        with:
          name: zig-windows
          path: build/cmake/zig-windows

      - name: Build audited archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./tools/package.ps1 -BuildDir build/cmake/zig-windows -OutputDir out -Version $version

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.sha256
            out/*.manifest.json

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -LiteralPath out -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "CineRTX $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

