#
# Cross-platform CI: compliance first, then Linux GCC, Windows MSVC, and the
# portable Zig toolchain. Tagged commits additionally produce the audited
# Windows release archive.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  compliance:
    name: SPDX and boundary audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit SPDX headers and GPL/MIT boundary
        run: cmake -P cmake/AuditSpdx.cmake

      - name: Audit named types (Std-First <= 35)
        run: cmake -P cmake/AuditTypes.cmake

      - name: Audit Core Engine Pure SLOC (<= 23,000)
        run: cmake -P cmake/AuditSloc.cmake

      - name: Audit repository privacy and host path hygiene
        run: cmake -P cmake/AuditPrivacy.cmake

      - name: Audit baseline symbol contracts
        run: cmake -P cmake/ContractGuard.cmake

  linux-gcc:
    name: Linux GCC (${{ matrix.build_type }})
    needs: compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja and FFmpeg development packages
        # The media container layer is unconditional, and on Linux it is
        # resolved through pkg-config, so the four -dev packages are a hard
        # configure-time dependency rather than an optional extra.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev

      - name: Configure
        run: >-
          cmake --preset linux-release
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        # The concurrency tests are exercised repeatedly: a rare scheduling
        # dependent failure must be caught here rather than on a user machine.
        run: ctest --preset linux-release --output-on-failure --repeat until-fail:10

      - name: Audit ELF dynamic dependencies
        run: |
          ldd .vs/build/cmake/linux-release/CineRTX
          ! ldd .vs/build/cmake/linux-release/CineRTX | grep -iE "libcuda|libnvcuvid|libnvidia-encode|libnvinfer"

      - name: Probe and CLI smoke test
        run: |
          set -euo pipefail
          ./.vs/build/cmake/linux-release/CineRTX --version
          ./.vs/build/cmake/linux-release/CineRTX --help
          ./.vs/build/cmake/linux-release/CineRTX --schema-json > .vs/build/schema.json
          jq -e '.defaults.codec == "av1" and (.params | length == 20) and any(.params[]; .key == "codec") and (.i18n.en != null) and (.i18n.zh != null)' .vs/build/schema.json > /dev/null
          # In headless CI containers without NVIDIA GPUs, probe may exit 0, 4 or 5
          ./.vs/build/cmake/linux-release/CineRTX --probe --json > .vs/build/probe.json || true
          jq -e '.abi_version == 2 or .abi_version == 4' .vs/build/probe.json > /dev/null

  windows-msvc:
    name: Windows MSVC
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-msvc-ninja

      - name: Build
        run: cmake --build --preset windows-msvc-ninja

      - name: Test
        run: ctest --preset windows-msvc-ninja --output-on-failure --repeat until-fail:10

      - name: Audit PE static import table (Single-EXE 1/1 kernel32.dll)
        run: cmake -DTARGET_BIN=.vs/build/cmake/windows-msvc-ninja/CineRTX.exe -P cmake/AuditImports.cmake

      - name: Probe and CLI smoke test
        shell: pwsh
        run: |
          $exe = ".vs/build/cmake/windows-msvc-ninja/CineRTX.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --schema-json > .vs\build\schema.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > .vs\build\probe.json"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { exit $LASTEXITCODE }
          $s = Get-Content .vs/build/schema.json -Raw | ConvertFrom-Json
          if ($s.defaults.codec -ne 'av1' -or $s.params.Count -ne 20 -or -not ($s.params | Where-Object { $_.key -eq 'codec' }) -or -not $s.i18n) { throw 'schema JSON validation failed' }
          $p = Get-Content .vs/build/probe.json -Raw | ConvertFrom-Json
          if ($p.abi_version -notin @(2, 4)) { throw "Unexpected abi_version: $($p.abi_version)" }
          Write-Host "Smoke test ok, params=$($s.params.Count) abi=$($p.abi_version)"

      - name: Upload portable binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          if-no-files-found: error
          path: |
            .vs/build/cmake/windows-msvc-ninja/CineRTX.exe
            .vs/build/cmake/windows-msvc-ninja/rtx_ngx_bridge.dll

  windows-zig:
    name: Windows Zig 0.13
    needs: compliance
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig 0.13.0
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig-0.13.0.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'zig-0.13.0'
          Invoke-WebRequest -Uri 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $zig = Get-ChildItem -LiteralPath $dest -Recurse -Filter 'zig.exe' | Select-Object -First 1
          if (-not $zig) { throw 'zig.exe was not found in the downloaded archive' }
          "RTX_ZIG=$($zig.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        run: cmake --preset zig-windows

      - name: Build
        run: cmake --build --preset zig-windows

      - name: Test
        run: ctest --preset zig-windows --output-on-failure --repeat until-fail:10

      - name: Audit PE static import table (Single-EXE 1/1 kernel32.dll)
        run: cmake -DTARGET_BIN=.vs/build/cmake/zig-windows/CineRTX.exe -P cmake/AuditImports.cmake

      - name: Probe and CLI smoke test
        shell: pwsh
        run: |
          $exe = ".vs/build/cmake/zig-windows/CineRTX.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --schema-json > .vs\build\schema.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c "`"$exe`" --probe --json > .vs\build\probe.json"
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 4 -and $LASTEXITCODE -ne 5) { exit $LASTEXITCODE }
          $s = Get-Content .vs/build/schema.json -Raw | ConvertFrom-Json
          if ($s.defaults.codec -ne 'av1' -or $s.params.Count -ne 20 -or -not ($s.params | Where-Object { $_.key -eq 'codec' }) -or -not $s.i18n) { throw 'schema JSON validation failed' }
          $p = Get-Content .vs/build/probe.json -Raw | ConvertFrom-Json
          if ($p.abi_version -notin @(2, 4)) { throw "Unexpected abi_version: $($p.abi_version)" }
          Write-Host "Smoke test ok, params=$($s.params.Count) abi=$($p.abi_version)"

      - name: Upload portable binaries
        uses: actions/upload-artifact@v4
        with:
          name: zig-windows
          if-no-files-found: error
          path: |
            .vs/build/cmake/zig-windows/CineRTX.exe
            .vs/build/cmake/zig-windows/rtx_ngx_bridge.dll

  package:
    name: Package release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gcc, windows-msvc, windows-zig]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download portable binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-msvc
          path: .vs/build/cmake/windows-msvc-ninja

      - name: Build audited archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          cmake -DBUILD_DIR=.vs/build/cmake/windows-msvc-ninja -DOUTPUT_DIR=out -DVERSION=$version -P cmake/PackageRelease.cmake

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          path: |
            out/*.zip
            out/*.sha256
            out/*.manifest.json

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -LiteralPath out -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "CineRTX $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
